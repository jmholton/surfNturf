[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surfnturf"
version = "0.2.0"
description = "surfNturf: Differentiable multi-conformer crystal hydration (Surf), conformer reconnection (Turf), 3D water mobility B(x), and X-ray solvent modelling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "James Holton"}
]
keywords = [
  "crystallography",
  "hydration",
  "bulk-solvent",
  "x-ray-diffraction",
  "ornstein-zernike",
  "multi-conformer",
  "gemmi"
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "gemmi>=0.6.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/jmholton/surfNturf"
Repository = "https://github.com/jmholton/surfNturf"

[project.scripts]
surfNturf = "surfnturf.cli:main"
surfnturf = "surfnturf.cli:main"

[tool.setuptools.packages.find]
include = ["surfnturf*"]

[tool.setuptools.package-data]
"surfnturf.data" = ["*.npz", "*.json"]
